# Shared defaults. Presets inherit with `base: base.yaml` and override what they need.
output_dir: runs

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

quant:
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  group_size: 64

data:
  train_path: data/sample_chat.jsonl
  val_ratio: 0.1
  format: auto
  train_on_completions_only: true
  max_val_samples: 500

training:
  epochs: 1
  batch_size: 1
  grad_accum_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  gradient_checkpointing: true
  eval_every_steps: 50
  save_every_steps: 50
  keep_top_k: 2
  keep_last_checkpoints: 1
  early_stopping_patience: 5
  abort_on_nan: true
  loss_spike_factor: 5.0

logging:
  tensorboard: true
  wandb:
    enabled: false          # flip to true (or pass --wandb) to stream to Weights & Biases
    project: finetune
    mode: online
  log_every_steps: 10
  sample_every_evals: 2
  sample_max_new_tokens: 200
  sample_prompts:
    - "Explain the difference between LoRA and QLoRA in two sentences."
    - "Write a Python function that checks whether a string is a palindrome."
    - "What are three tips for writing a clear commit message?"

modal:
  secrets: [huggingface]    # add "wandb" if logging.wandb.enabled
