# gpt-oss-20b (MoE, 21B total / 3.6B active) — LoRA on bf16 weights (Modal H100 80GB).
# The released weights are MXFP4; the CUDA backend dequantizes them to bf16 for training
# (bitsandbytes cannot quantize the fused MoE expert tensors, so "qlora" is not used here).
base: base.yaml
method: lora
model:
  name_or_path: openai/gpt-oss-20b
  params_b: 20.9
  max_seq_length: 2048
  attn_implementation: eager
lora:
  r: 8
  alpha: 16
  target_modules: all-linear      # attention projections + router
  # Uncomment (needs peft>=0.17) to also adapt some MoE expert weights:
  # target_parameters:
  #   - "7.mlp.experts.gate_up_proj"
  #   - "7.mlp.experts.down_proj"
training:
  batch_size: 2
  grad_accum_steps: 8
  learning_rate: 2.0e-4
modal:
  gpu: H100
  timeout_hours: 12
  cost_per_gpu_hour: 3.95
