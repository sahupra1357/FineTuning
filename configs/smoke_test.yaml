# Tiny model for a quick end-to-end check of the pipeline (minutes, any hardware).
#   Mac:   finetune train --config configs/smoke_test.yaml --backend mac
#   Modal: modal run modal_app.py --config configs/smoke_test.yaml
base: base.yaml
method: lora
model:
  name_or_path: HuggingFaceTB/SmolLM2-135M-Instruct
  params_b: 0.135
  max_seq_length: 512
training:
  max_steps: 30
  grad_accum_steps: 2
  learning_rate: 5.0e-4
  eval_every_steps: 10
  save_every_steps: 10
  gradient_checkpointing: false
logging:
  log_every_steps: 2
  sample_every_evals: 1
  sample_max_new_tokens: 48
modal:
  gpu: L4                 # cheap, supports bf16
  timeout_hours: 0.5
  cost_per_gpu_hour: 0.80
